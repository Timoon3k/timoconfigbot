services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timonconfigs
      POSTGRES_PASSWORD: timonconfigs_dev
      POSTGRES_DB: timonconfigs
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timonconfigs -d timonconfigs"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - timonconfigs_postgres:/var/lib/postgresql/data

volumes:
  timonconfigs_postgres:
